<head>

<body>
  <div id="root"></div>
  <script>
    function playMovie(tmdbId, title) {
      if (window.AndroidBridge && typeof window.AndroidBridge.playMovie === 'function') {
        window.AndroidBridge.playMovie(String(tmdbId), title || '');
      } else {
        console.warn("AndroidBridge is not available (running in web browser)");
      }
    }

    function playTvShow(tmdbId, season, episode, title) {
      if (window.AndroidBridge && typeof window.AndroidBridge.playTvShow === 'function') {
        window.AndroidBridge.playTvShow(String(tmdbId), parseInt(season), parseInt(episode), title || '');
      } else {
        console.warn("AndroidBridge is not available (running in web browser)");
      }
    }
  </script>
</body>
</html>
